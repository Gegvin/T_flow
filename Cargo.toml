[package]
name = "T-flow"
version = "0.0.1"
edition = "2024"

[dependencies]
# 1. лексер
logos = "0.16"

# 2. Обработка аргументов командной строки (CLI) (опционально)
clap = { version = "4.6", features = ["derive"] }

# 3. Красивый вывод ошибок (опционально)
ariadne = "0.6"

# 4. Помощь в расчете координат (строка:колонка) (опционально)
line-col = "0.2"

# 5. Сериализация (опционально)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Для удобных тестов и сравнения результатов в CI (опционально)
pretty_assertions = "1.4"
tempfile = "3.0"

# Для тестов через систему снимков (опционально)
insta = { version = "1.47", features = ["yaml"] }